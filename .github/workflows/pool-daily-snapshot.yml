name: Pool Daily Snapshot

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pool summary and hashrate, append daily snapshot
        run: |
          set -e
          SUMMARY=$(curl -s "https://pool.honest.money/api/pool/pool/summary")
          HASH24H=$(curl -s "https://pool.honest.money/api/pool/pool/hashrate?window=24h&algo=scrypt")

          node -e '
            const fs = require("fs");
            const summary = JSON.parse(process.argv[1]);
            const hash = JSON.parse(process.argv[2]);

            const file = "daily-history.json";
            let history = [];
            if (fs.existsSync(file)) {
              try { history = JSON.parse(fs.readFileSync(file, "utf8")); } catch (e) { history = []; }
            }

            const effByCoin = {};
            (summary.effort || []).forEach((e) => { effByCoin[e.symbol] = e; });

            const ltcBlock = (summary.last_blocks || []).find((b) => b.symbol === "LTC");
            const dogeBlock = (summary.last_blocks || []).find((b) => b.symbol === "DOGE");

            const points = hash.points || [];
            const avgHashrate = points.length
              ? points.reduce((sum, p) => sum + (p.hashrate || 0), 0) / points.length
              : null;

            const today = new Date().toISOString().slice(0, 10);

            const entry = {
              date: today,
              ts: Date.now(),
              ltcHeight: ltcBlock ? ltcBlock.height : null,
              dogeHeight: dogeBlock ? dogeBlock.height : null,
              ltcDifficulty: effByCoin.LTC ? effByCoin.LTC.network_difficulty : null,
              dogeDifficulty: effByCoin.DOGE ? effByCoin.DOGE.network_difficulty : null,
              avgHashrate: avgHashrate,
            };

            const idx = history.findIndex((h) => h.date === today);
            if (idx >= 0) history[idx] = entry;
            else history.push(entry);

            history.sort((a, b) => a.ts - b.ts);

            const maxEntries = 800;
            if (history.length > maxEntries) {
              history = history.slice(history.length - maxEntries);
            }

            fs.writeFileSync(file, JSON.stringify(history, null, 2));
          ' "$SUMMARY" "$HASH24H"

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-history.json
          git diff --quiet --cached || git commit -m "Update daily pool snapshot"
          git push
